name: Build app Android

# Build file APK thử nghiệm của app Android (thư mục android/) mỗi khi code app đổi.
# Tải file APK ở mục Artifacts của lần chạy, rồi cài lên điện thoại.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kiểm thử phần lõi (gọi API, đọc dữ liệu)
        run: ./gradlew :core:test --console=plain

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Giữ lại file APK
        uses: actions/upload-artifact@v4
        with:
          name: am-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
