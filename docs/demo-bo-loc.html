<!doctype html>
<html lang="vi" data-tong="toi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Am — demo bộ lọc đầy đủ theo từng chuyên mục</title>
<style>
  /* Bảng màu lấy nguyên từ src/app/globals.css của app thật */
  [data-tong="toi"]{
    --background:#0e0e0e; --foreground:#f2f2f2; --nen-menu:#070707;
    --khoi:#1a1a1a; --khoi-2:#141414;
    --vien:#2a2a2a; --vien-ro:#3a3a3a;
    --chu-phu:#a8a8a8; --chu-mo:#6a6a6a;
    --chip-nen:#2a2a2a; --chip-hover:#333;
    --cam-50:#1c1310; --cam-100:#2a1d16; --cam-300:#e0a184;
    --cam-500:#d4845f; --cam-600:#c2724f; --cam-700:#a85f3f;
    --cam-chinh:#d4845f; --cam-chu-tren:#141414;
    color-scheme:dark;
  }
  [data-tong="sang"]{
    --background:#fdfbf7; --foreground:#2c2720; --nen-menu:#f2ebdf;
    --khoi:#ffffff; --khoi-2:#fbf8f3;
    --vien:#e7ddcd; --vien-ro:#d6c8b2;
    --chu-phu:#7a6f5d; --chu-mo:#a4967f;
    --chip-nen:#f4eee4; --chip-hover:#e7ddcd;
    --cam-50:#fdf3ec; --cam-100:#fae2d1; --cam-300:#f0a878;
    --cam-500:#dd6b20; --cam-600:#c2551a; --cam-700:#9c4415;
    --cam-chinh:#c2551a; --cam-chu-tren:#ffffff;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--background); color:var(--foreground);
       font-family:Arial,Helvetica,sans-serif; font-size:14px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit; text-decoration:none;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--vien); border-radius:5px;}

  /* ---------- thanh trên ---------- */
  header{position:sticky; top:0; z-index:20; height:56px; display:flex; align-items:center;
         gap:12px; padding:0 16px; background:var(--nen-menu); border-bottom:1px solid var(--vien);}
  .logo{font-size:18px; font-weight:700; letter-spacing:-.02em; color:var(--cam-chinh);}
  .o-tim{flex:1; max-width:576px; margin:0 auto;}
  .o-tim input{width:100%; border-radius:999px; border:1px solid var(--vien);
    background:var(--background); color:var(--foreground); padding:7px 16px; font-size:13px;}
  .o-tim input::placeholder{color:var(--chu-mo);}
  .icon-btn{border-radius:999px; padding:8px; color:var(--chu-phu); display:flex;}
  .icon-btn:hover{background:var(--cam-100);}
  .tong-switch{display:flex; gap:3px; background:var(--khoi); border:1px solid var(--vien);
    border-radius:999px; padding:3px;}
  .tong-switch button{border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:600; color:var(--chu-phu);}
  .tong-switch button.on{background:var(--cam-chinh); color:var(--cam-chu-tren);}

  /* ---------- khung + menu trái ---------- */
  .khung{display:flex;}
  nav{position:sticky; top:56px; height:calc(100vh - 56px); width:224px; flex:none;
      overflow-y:auto; padding:8px; background:var(--nen-menu); border-right:1px solid var(--vien);}
  .nav-nhan{padding:8px 12px 4px; font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; color:var(--chu-mo);}
  .nav-muc{display:flex; align-items:center; gap:16px; border-radius:8px; padding:8px 12px;
    font-size:13.5px; color:var(--chu-phu); width:100%; text-align:left;}
  .nav-muc:hover{background:var(--cam-50);}
  .nav-muc.on{background:var(--cam-100); color:var(--cam-300); font-weight:500;}
  [data-tong="sang"] .nav-muc.on{color:var(--cam-700);}
  .nav-muc.tat{color:var(--chu-mo); cursor:default;}
  .nav-muc.tat:hover{background:none;}
  .nav-muc svg{width:20px; height:20px; flex:none;}
  .nav-chia{margin:4px 0; border-top:1px solid var(--vien);}
  main{flex:1; min-width:0; padding:24px 28px 80px;}
  @media (max-width:900px){ nav{display:none;} main{padding:18px 14px 60px;} }

  h1{font-size:20px; font-weight:600; letter-spacing:-.01em; margin:0 0 16px;}

  /* ---------- chip chuyên mục ---------- */
  .chip-nhom{display:flex; gap:8px; margin-bottom:18px;}
  .chip-nhom button{flex:1; min-width:0; border-radius:12px; padding:10px 12px;
    font-size:13.5px; font-weight:600; background:var(--chip-nen); transition:.18s;}
  .chip-nhom button:hover{transform:translateY(-2px);}
  .chip-nhom button.on{background:var(--cam-chinh); color:var(--cam-chu-tren);
    box-shadow:0 8px 20px -6px var(--cam-chinh);}
  .chip-nhom .so{margin-left:6px; opacity:.6; font-variant-numeric:tabular-nums;}
  @media (max-width:900px){ .chip-nhom{flex-wrap:wrap;} .chip-nhom button{flex:0 0 auto;} }

  /* ---------- bố cục lọc + kết quả ---------- */
  .bo-cuc{display:grid; grid-template-columns:252px 1fr; gap:24px; align-items:start;}
  @media (max-width:1100px){ .bo-cuc{grid-template-columns:1fr;} }

  .cot-loc{background:var(--khoi); border:1px solid var(--vien); border-radius:12px;
    padding:16px; position:sticky; top:72px; max-height:calc(100vh - 96px); overflow-y:auto;}
  .loc-dau{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
    padding-bottom:12px; border-bottom:1px solid var(--vien);}
  .loc-dau b{font-size:13px;}
  .loc-dau button{font-size:11.5px; color:var(--cam-chinh); font-weight:600;}
  .nhom-loc{margin-bottom:16px;}
  .nhom-loc:last-child{margin-bottom:0;}
  .nl-ten{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--chu-mo); font-weight:700; margin-bottom:8px;}
  .nl-ghi{font-size:11px; color:var(--chu-mo); margin-top:7px; line-height:1.5;}
  .hang-pill{display:flex; gap:6px; flex-wrap:wrap;}
  .pill{border-radius:999px; padding:5px 11px; font-size:11.5px; font-weight:600;
    background:var(--chip-nen); color:var(--foreground);}
  .pill:hover{background:var(--chip-hover);}
  .pill.on{background:var(--cam-chinh); color:var(--cam-chu-tren);}
  .pill.tat{opacity:.35; cursor:not-allowed;}
  .dong-check{display:flex; align-items:flex-start; gap:8px; font-size:12.5px;
    padding:4px 0; color:var(--chu-phu); cursor:pointer;}
  .dong-check input{margin-top:2px; accent-color:var(--cam-chinh); cursor:pointer;}
  .hop-cho{border:1.5px dashed var(--vien-ro); border-radius:8px; padding:12px;
    font-size:11.5px; color:var(--chu-mo); line-height:1.55; background:var(--khoi-2);}
  .o-nhap{width:100%; border-radius:8px; border:1px solid var(--vien); background:var(--background);
    color:var(--foreground); padding:6px 10px; font-size:12px;}
  .chia-lon{margin:18px 0 16px; border-top:1px solid var(--vien); padding-top:16px;}
  .chia-lon .nhan{font-size:10.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.05em; color:var(--cam-chinh); margin-bottom:14px;}

  /* ---------- thanh kết quả ---------- */
  .thanh-kq{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;}
  .thanh-kq .so-kq{font-size:13px; color:var(--chu-phu);}
  select{border:1px solid var(--vien-ro); background:var(--khoi); color:var(--foreground);
    border-radius:8px; padding:6px 10px; font-size:12.5px;}

  /* ---------- thẻ nội dung ---------- */
  .luoi{display:grid; grid-template-columns:repeat(3,1fr); gap:22px 16px;}
  @media (max-width:1400px){ .luoi{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .luoi{grid-template-columns:1fr;} }
  .the .anh{position:relative; aspect-ratio:16/9; border-radius:12px; background:var(--khoi);
    border:1px solid var(--vien); display:flex; align-items:center; justify-content:center;
    color:var(--chu-mo); overflow:hidden;}
  .the .anh .thoi-luong{position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.8);
    color:#fff; font-size:11px; padding:1px 5px; border-radius:4px; font-variant-numeric:tabular-nums;}
  .nhan-goc{position:absolute; left:8px; top:8px; font-size:9.5px; font-weight:800;
    letter-spacing:.03em; padding:3px 7px; border-radius:5px; background:rgba(0,0,0,.72); color:#fff;}
  .nhan-nguon{position:absolute; right:8px; top:8px; font-size:9.5px; font-weight:800;
    letter-spacing:.03em; padding:3px 7px; border-radius:5px; color:#fff;}
  .n-youtube{background:rgba(220,38,38,.9);} .n-blog{background:rgba(2,132,199,.9);}
  .n-dienddan{background:rgba(124,58,237,.9);} .n-podcast{background:rgba(5,150,105,.9);}
  .n-soundcloud{background:rgba(217,119,6,.9);}
  .the .tieu-de{font-size:13.5px; font-weight:600; line-height:1.35; margin:9px 0 5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .the .phu{font-size:11.5px; color:var(--chu-mo); line-height:1.5;}
  .the .the-chips{display:flex; gap:5px; flex-wrap:wrap; margin-top:7px;}
  .tc{font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:999px;
    background:var(--chip-nen); color:var(--chu-phu);}
  .tc.diem{background:var(--cam-100); color:var(--cam-300);}
  [data-tong="sang"] .tc.diem{color:var(--cam-700);}

  /* ---------- ghi chú dưới ---------- */
  .ghi-chu-cuoi{margin-top:32px; background:var(--khoi); border:1px solid var(--vien);
    border-radius:12px; padding:20px 22px;}
  .ghi-chu-cuoi h2{font-size:14px; margin:0 0 10px;}
  .ghi-chu-cuoi p{font-size:12.5px; color:var(--chu-phu); line-height:1.7; margin:0 0 10px;}
  .ghi-chu-cuoi code{background:var(--chip-nen); padding:1px 5px; border-radius:4px; font-size:11.5px;}
  .bang-td{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;}
  .bang-td th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--chu-mo); padding:0 8px 8px; border-bottom:1px solid var(--vien-ro);}
  .bang-td td{padding:8px; border-bottom:1px solid var(--vien); vertical-align:top; color:var(--chu-phu);}
  .tt{font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:999px; white-space:nowrap;}
  .tt-ok{background:rgba(34,197,94,.15); color:#4ade80;}
  .tt-thieu{background:rgba(234,179,8,.15); color:#facc15;}
  .tt-chua{background:rgba(239,68,68,.15); color:#f87171;}
</style>
</head>
<body>

<header>
  <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <span class="logo">Am</span>
  <div class="o-tim"><input type="search" placeholder="Tìm trong nội dung đã quét…"></div>
  <div class="tong-switch">
    <button onclick="datTong('sang',this)">Sáng</button>
    <button class="on" onclick="datTong('toi',this)">Tối</button>
  </div>
</header>

<div class="khung">
  <nav>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Trang chủ</button>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>Am nói với bạn</button>
    <button class="nav-muc on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Khám phá</button>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>New</button>
    <div class="nav-chia"></div>
    <div class="nav-nhan">Của bạn</div>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Lịch sử xem</button>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 5v14M8 5v14M12 5h8v14h-8z"/></svg>Thư viện</button>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h11M3 12h11M3 18h7M17 16V7l4 2"/></svg>Playlist</button>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Ghi chú</button>
    <button class="nav-muc tat" title="Chưa làm — dự kiến Phase 6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Tủ sách</button>
    <div class="nav-chia"></div>
    <div class="nav-nhan">Trợ lý</div>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 11.5a8.4 8.4 0 01-9 8.4L3 21l1.1-4.5A8.4 8.4 0 1121 11.5z"/></svg>Trò chuyện</button>
    <button class="nav-muc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006 19.4a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 13.6H3a2 2 0 110-4h.1A1.6 1.6 0 004.6 6a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0010 3.1V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1A2 2 0 1119.6 6l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>Cài đặt</button>
  </nav>

  <main>
    <h1>Khám phá</h1>
    <div class="chip-nhom" id="chipNhom"></div>
    <div class="bo-cuc">
      <aside class="cot-loc">
        <div class="loc-dau">
          <b>Bộ lọc · <span id="soLoc">0</span></b>
          <button onclick="xoaHet()">Xoá hết</button>
        </div>
        <div id="cotLoc"></div>
      </aside>
      <div>
        <div class="thanh-kq">
          <span class="so-kq" id="soKq"></span>
          <select>
            <option>Sắp xếp: Phù hợp nhất</option>
            <option>Sắp xếp: Chất lượng cao nhất</option>
            <option>Sắp xếp: Mới nhất trước</option>
          </select>
        </div>
        <div class="luoi" id="luoi"></div>

        <div class="ghi-chu-cuoi" id="ghiChu"></div>
      </div>
    </div>
  </main>
</div>

<script>
/* =========================================================================
   Bộ lọc CHUNG — dùng lại y hệt ở mọi chuyên mục.
   Định nghĩa một lần, không chép lại sáu lần, để không bao giờ có chuyện
   tab này có "Loại giọng" mà tab kia lại quên.
   ========================================================================= */
const LOC_CHUNG = [
  { ten:'Nguồn', kieu:'check', muc:['YouTube','Blog','Diễn đàn','Podcast','SoundCloud'], chon:[0,1,2,3,4] },
  { ten:'Quan hệ với nguồn', kieu:'pill', muc:['Tất cả','Đã theo dõi','Chưa theo dõi'], chon:[0] },
  { ten:'Thời lượng', kieu:'pill', muc:['Dưới 10 phút','10–20 phút','20–40 phút','Trên 40 phút'],
    ghi:'Bốn dải liền nhau, không hở. Bản đang chạy chỉ có hai nút rời "Dưới 10 phút" và "Trên 20 phút" nên khoảng 10–20 phút không cách nào chọn được.' },
  { ten:'Nghe được bằng tiếng Việt', kieu:'pill', muc:['Tiếng Việt gốc','Đã lồng tiếng','Có phụ đề Việt','Đã thuật lại'],
    ghi:'Không lọc bỏ tiếng nước ngoài — nội dung hay tiếng Anh thì đưa vào hàng lồng tiếng, không giấu đi.' },
  { ten:'Loại giọng', kieu:'pill', muc:['Người thật','Máy đọc (TTS)','Không lời','Chỉ có chữ'] },
  { ten:'Ngày đăng', kieu:'pill', muc:['3 ngày','1 tuần','1 tháng','Tất cả'], chon:[3] },
  { ten:'Quy mô nguồn', kieu:'pill', muc:['Dưới 10N','10N – 100N','100N – 1Tr','Trên 1Tr'],
    ghi:'Lọc theo lượng người theo dõi nguồn, không phải lượt xem của bài.' },
  { ten:'Chỉ số tương tác', kieu:'check', muc:['Tỷ lệ thích cao','Tỷ lệ bình luận cao','Lượt xem đang tăng nhanh'] },
  { ten:'Trạng thái của bạn', kieu:'pill', muc:['Chưa xem','Đang dở','Đã xong','Từng đánh giá cao'], chon:[0] },
  { ten:'Cảm xúc đã gắn', kieu:'pill', muc:['Rất hay','Hay','Bình thường','Không hợp'] },
  { ten:'Loại bỏ', kieu:'check', muc:['Ẩn nguồn đã chặn','Ẩn tác giả đã chặn','Ẩn giọng đọc đã chặn','Gộp nội dung trùng lặp'], chon:[0,3] },
  { ten:'Gợi ý theo giờ', kieu:'check', muc:['Ưu tiên nội dung hợp giờ hiện tại'],
    ghi:'Sáng sớm ưu tiên bài ngắn và nhạc tập; tối muộn ưu tiên giảng pháp và truyện.' },
];

/* =========================================================================
   Bộ lọc RIÊNG từng chuyên mục + dữ liệu mẫu
   ========================================================================= */
const NHOM = {
  tat_ca: {
    ten:'Tất cả', so:113, rieng:[],
    moTa:'<h2>Tab "Tất cả" chỉ có bộ lọc chung</h2><p>Không có trường riêng nào, vì trường riêng chỉ có nghĩa bên trong một chuyên mục — không thể hỏi "trường phái triết học" của một bản nhạc.</p><p><b>Chú ý: không có tab "Khác".</b> Am đi tìm năm mảng cụ thể cộng từ khoá bạn tự gõ. Thứ không thuộc mảng nào là thứ <i>lọt vào</i>, bị loại ở bước phân loại chứ không được bày ra thành một mục riêng.</p>',
    the:[
      {t:'Sư Hoằng Hiền hỏi về thần thông — Thầy Minh Tuệ trả lời',n:'youtube',ng:'Chân Tâm',tl:'42:18',g:'GIẢNG PHÁP',c:['triết học','vấn đáp'],d:'8,7'},
      {t:'Anthropic ra mắt bộ công cụ agent mới cho doanh nghiệp',n:'blog',ng:'Anthropic Blog',tl:'8 phút đọc',g:'ĐÃ THUẬT LẠI',c:['AI','tin Claude'],d:'9,1'},
      {t:'Vì sao tuổi thọ tăng 10 năm mà số năm sống khoẻ thì không?',n:'podcast',ng:'Have A Sip',tl:'1:04:22',g:null,c:['khoa học','y học'],d:'8,4'},
    ]
  },
  ai: {
    ten:'AI', so:32,
    rieng:[
      { ten:'Chủ đề con', kieu:'pill', muc:['Tin về Claude','Tin AI nói chung','AI cho doanh nghiệp','Kinh nghiệm viết code','Hướng dẫn dùng Claude'], chon:[0] },
      { ten:'Hạng nguồn', kieu:'pill', muc:['Hãng chính thức','Chuyên gia cá nhân','Diễn đàn cộng đồng','Trang tổng hợp'], chon:[0,1],

const TEN_NGUON = { youtube:['YOUTUBE','n-youtube'], blog:['BLOG','n-blog'],
  dienddan:['DIỄN ĐÀN','n-dienddan'], podcast:['PODCAST','n-podcast'], soundcloud:['SOUNDCLOUD','n-soundcloud'] };

let nhomHienTai = 'tat_ca';
const trangThai = {};   // khoá "chuyên mục | riêng hay chung | tên nhóm | chỉ số"

/**
 * Khoá trạng thái phải kèm "riêng hay chung".
 *
 * Không có phần đó thì tab Tùy chọn hỏng: nó có nhóm "Thời lượng" riêng
 * (5–20ph / >20ph / >40ph) mà bộ lọc chung cũng có nhóm tên y hệt "Thời lượng"
 * (4 dải). Hai nhóm khác nhau nhưng trùng tên nên dùng chung một khoá — bấm
 * nút bên trên thì nút bên dưới cũng sáng theo.
 */
function khoa(pv, ten, i){ return nhomHienTai + '|' + pv + '|' + ten + '|' + i; }

function veChipNhom(){
  document.getElementById('chipNhom').innerHTML = Object.entries(NHOM).map(([ma,n]) =>
    `<button class="${ma===nhomHienTai?'on':''}" onclick="chonNhom('${ma}')">${n.ten}<span class="so">${n.so}</span></button>`
  ).join('');
}

function veNhomLoc(g, pv){
  if (g.kieu === 'cho')
    return `<div class="nhom-loc"><div class="nl-ten">${g.ten}</div><div class="hop-cho">${g.noiDung}</div></div>`;

  if (g.kieu === 'nhap')
    return `<div class="nhom-loc"><div class="nl-ten">${g.ten}</div><input class="o-nhap" placeholder="${g.chogo}"></div>`;

  const than = g.kieu === 'check'
    ? g.muc.map((m,i) => {
        const bat = trangThai[khoa(pv,g.ten,i)];
        return `<label class="dong-check"><input type="checkbox" ${bat?'checked':''} onchange="bat('${pv}','${g.ten}',${i})"> ${m}</label>`;
      }).join('')
    : `<div class="hang-pill">` + g.muc.map((m,i) => {
        const bat = trangThai[khoa(pv,g.ten,i)];
        return `<button class="pill ${bat?'on':''} ${g.tat?'tat':''}" ${g.tat?'':`onclick="bat('${pv}','${g.ten}',${i})"`}>${m}</button>`;
      }).join('') + `</div>`;

  return `<div class="nhom-loc"><div class="nl-ten">${g.ten}</div>${than}` +
         (g.ghi ? `<p class="nl-ghi">${g.ghi}</p>` : '') + `</div>`;
}

function veCotLoc(){
  const n = NHOM[nhomHienTai];
  let html = '';
  const kieuNhan = 'font-size:10.5px;font-weight:800;text-transform:uppercase;' +
                   'letter-spacing:.05em;color:var(--cam-chinh);margin-bottom:14px;';
  if (n.rieng.length){
    html += `<div style="${kieuNhan}">Riêng mục ${n.ten}</div>`;
    html += n.rieng.map((g) => veNhomLoc(g, 'r')).join('');
    html += `<div class="chia-lon"><div class="nhan">Chung mọi chuyên mục</div>`;
  } else {
    html += `<div style="${kieuNhan}">Chung mọi chuyên mục</div><div>`;
  }
  html += LOC_CHUNG.map((g) => veNhomLoc(g, 'c')).join('') + `</div>`;
  document.getElementById('cotLoc').innerHTML = html;

  const dem = Object.entries(trangThai).filter(([k,v]) => v && k.startsWith(nhomHienTai+'|')).length;
  document.getElementById('soLoc').textContent = dem;
}

function veKetQua(){
  const n = NHOM[nhomHienTai];
  document.getElementById('soKq').textContent = `${n.so} nội dung · đang xem ${n.the.length} mẫu`;
  document.getElementById('luoi').innerHTML = n.the.map(t => {
    const [tenN, lopN] = TEN_NGUON[t.n];
    return `<article class="the">
      <div class="anh">
        ${t.g ? `<span class="nhan-goc">${t.g}</span>` : ''}
        <span class="nhan-nguon ${lopN}">${tenN}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="26" height="26"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
        <span class="thoi-luong">${t.tl}</span>
      </div>
      <div class="tieu-de">${t.t}</div>
      <div class="phu">${t.ng}</div>
      <div class="the-chips">
        <span class="tc diem">điểm ${t.d}</span>
        ${t.c.map(c => `<span class="tc">${c}</span>`).join('')}
      </div>
    </article>`;
  }).join('');
  document.getElementById('ghiChu').innerHTML = n.moTa;
}

function bat(pv, ten, i){
  const k = khoa(pv, ten, i);
  trangThai[k] = !trangThai[k];
  veCotLoc();
}

function xoaHet(){
  for (const k of Object.keys(trangThai)) if (k.startsWith(nhomHienTai+'|')) delete trangThai[k];
  veCotLoc();
}

function chonNhom(ma){
  nhomHienTai = ma;
  const n = NHOM[ma];
  // Đặt sẵn các lựa chọn mặc định, chỉ lần đầu bước vào tab
  const datMac = (g, pv) => (g.chon || []).forEach(i => {
    const k = khoa(pv, g.ten, i);
    if (!(k in trangThai)) trangThai[k] = true;
  });
  n.rieng.forEach(g => datMac(g, 'r'));
  LOC_CHUNG.forEach(g => datMac(g, 'c'));
  veChipNhom(); veCotLoc(); veKetQua();
}

function datTong(t, el){
  document.documentElement.setAttribute('data-tong', t);
  document.querySelectorAll('.tong-switch button').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}

chonNhom('tat_ca');
</script>
